name: CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.15.1

      - name: Cache pnpm dependencies
        uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            priyankashah31/linklyapp:latest
            priyankashah31/linklyapp:${{ github.sha }}
          build-args: | # Still useful for build-time args
            # ... (your build-args if any)
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Pushed Image
        run: docker pull priyankashah31/linklyapp:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            sudo docker pull priyankashah31/linklyapp:latest
            sudo docker stop linklyapp || true
            sudo docker rm linklyapp || true

            sudo docker run -d --name linklyapp -p 3000:3000 \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              -e BASE_URL="${{ secrets.BASE_URL }}" \
              -e IPINFO_API_KEY="${{ secrets.IPINFO_API_KEY }}" \
              priyankashah31/linklyapp:latest

          debug: true
          command_timeout: 20m
          timeout: 60s