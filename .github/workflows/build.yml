name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mydatabase
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Setup pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      # Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'pnpm'

      # Clear pnpm store
      - name: Clear pnpm store
        run: pnpm store prune

      # Install Dependencies
      - name: Install Dependencies
        run: pnpm install

      # Wait for Postgres to be ready
      - name: Wait for Postgres to be ready
        run: |
          while ! pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for database to be ready..."
            sleep 2
          done

      # Generate Prisma client
      - name: Generate Prisma client
        run: pnpm prisma generate

      # Run database migrations
      - name: Run database migrations
        run: pnpm prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mydatabase

      # Build the application
      - name: Build application
        run: pnpm build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mydatabase
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          BASE_URL: ${{ secrets.BASE_URL }}
          IPINFO_API_KEY: ${{ secrets.IPINFO_API_KEY }}

      # Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # Build and tag Docker image
      - name: Build and tag Docker image
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mydatabase
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          BASE_URL: ${{ secrets.BASE_URL }}
          IPINFO_API_KEY: ${{ secrets.IPINFO_API_KEY }}
        run: |
          docker build \
            --build-arg DATABASE_URL="${DATABASE_URL}" \
            --build-arg JWT_SECRET="${JWT_SECRET}" \
            --build-arg BASE_URL="${BASE_URL}" \
            --build-arg IPINFO_API_KEY="${IPINFO_API_KEY}" \
            -t priyankashah31/myapp:latest .
          docker tag priyankashah31/myapp:latest priyankashah31/myapp:${{ github.sha }}

      # Push Docker images
      - name: Push Docker images to Docker Hub
        run: |
          docker push priyankashah31/myapp:latest
          docker push priyankashah31/myapp:${{ github.sha }}