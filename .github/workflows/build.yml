# This is For PR_CHECK and DockerImage Generate


name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mydatabase
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: |
          pnpm config set store-dir .pnpm-store
          pnpm install --no-frozen-lockfile --verbose

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Run database migrations
        run: pnpm prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mydatabase

      - name: Build application
        run: pnpm build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mydatabase
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          BASE_URL: ${{ secrets.BASE_URL }}
          IPINFO_API_KEY: ${{ secrets.IPINFO_API_KEY }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            priyankashah31/linklyapp:latest
            priyankashah31/linklyapp:${{ github.sha }}
          build-args: |
            DATABASE_URL=postgresql://postgres:postgres@localhost:5432/mydatabase
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            BASE_URL=${{ secrets.BASE_URL }}
            IPINFO_API_KEY=${{ secrets.IPINFO_API_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max    
      # Stop and remove any running containers (cleanup step)
      - name: Cleanup containers
        run: |
          docker ps -q --filter "ancestor=priyankashah31/linklyapp" | xargs --no-run-if-empty docker stop
          docker ps -a -q --filter "ancestor=priyankashah31/linklyapp" | xargs --no-run-if-empty docker rm
    