jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mydatabase
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Run database migrations
        run: pnpm prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mydatabase

      - name: Build application
        run: pnpm build

      - name: Save build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: built-app
          path: .next  # Adjust based on your Next.js output directory

  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: built-app
          path: .next  # Adjust as needed

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and test Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false  # Don't push during PR checks
          load: true   # Load the image locally for testing
          build-args: |
            DATABASE_URL=postgresql://postgres:postgres@database:5432/mydatabase
          tags: |
            myapp:test

      - name: Test Docker Compose
        run: |
          docker compose -f compose.yml config
          docker compose up -d
          sleep 10
          docker compose ps
          curl -f http://localhost:3000 || exit 1
          docker compose down

      - name: Push Docker image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          build-args: |
            DATABASE_URL=postgresql://postgres:postgres@database:5432/mydatabase
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }}
